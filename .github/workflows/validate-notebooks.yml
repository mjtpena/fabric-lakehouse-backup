# GitHub Actions workflow to validate notebook structure, syntax and behaviour
name: Validate Notebooks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.Notebook/**'
      - 'tests/**'
      - 'ruff.toml'
      - '.github/workflows/**'
      - '*.yml'
      - '*.md'
  workflow_dispatch:

jobs:
  validate:
    name: Lint and unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Fabric Runtime 1.3 runs Python 3.11, Runtime 2.0 runs Python 3.13
        python-version: [ '3.11', '3.13' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.16.8

    - name: Compile Fabric notebook Python files
      run: |
        for notebook in nb_lakehouse_backup.Notebook nb_lakehouse_restore.Notebook nb_lakehouse_cleanup.Notebook; do
          python -m py_compile "$notebook/notebook-content.py"
          echo "✅ $notebook/notebook-content.py: valid Python ${{ matrix.python-version }} syntax"
        done

    - name: Lint (unused imports, undefined names, bare except)
      run: ruff check --output-format=github .

    - name: Notebook structure and helper unit tests
      run: python -m unittest discover -s tests -v

    - name: Check documentation links
      run: |
        python -c "
        import os
        import re

        # Check for broken relative links in markdown files
        md_files = []
        for root, dirs, files in os.walk('.'):
            # Skip hidden directories
            dirs[:] = [d for d in dirs if not d.startswith('.')]
            for file in files:
                if file.endswith('.md'):
                    md_files.append(os.path.join(root, file))

        for md_file in md_files:
            with open(md_file, 'r') as f:
                content = f.read()
                # Find markdown links
                links = re.findall(r'\[.*?\]\((.*?)\)', content)
                for link in links:
                    # Skip URLs and anchors
                    if link.startswith('http') or link.startswith('#'):
                        continue
                    # Handle links with anchors
                    link_path = link.split('#')[0]
                    if link_path:
                        full_path = os.path.join(os.path.dirname(md_file), link_path)
                        if not os.path.exists(full_path):
                            print(f'⚠️  Broken link in {md_file}: {link}')

        print('✅ Documentation link check completed')
        "

  spark:
    # Runs the notebooks end to end on open-source Spark + Delta Lake with a local stand-in
    # for notebookutils and OneLake (see tests/spark_harness.py). Not a substitute for a
    # run in a Fabric workspace, but it executes every notebook cell on the same Spark and
    # Delta major versions as the Fabric runtimes.
    name: End-to-end on Spark ${{ matrix.spark }} (like Fabric Runtime ${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: '1.3'
            spark: '3.5'
            python-version: '3.11'
            java-version: '17'
            packages: 'pyspark==3.5.* delta-spark==3.2.*'
          - runtime: '2.0'
            spark: '4.1'
            python-version: '3.13'
            java-version: '21'
            packages: 'pyspark==4.1.* delta-spark==4.2.*'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java-version }}

    - name: Cache Delta Lake jars
      uses: actions/cache@v4
      with:
        path: |
          ~/.ivy2
          ~/.ivy2.5.2
        key: ivy-spark-${{ matrix.spark }}-${{ hashFiles('.github/workflows/validate-notebooks.yml') }}

    - name: Install Spark and Delta Lake
      run: |
        python -m pip install --upgrade pip
        pip install ${{ matrix.packages }}

    - name: Backup / restore / cleanup matrix
      working-directory: tests
      env:
        REQUIRE_SPARK_TESTS: '1'
      run: python -m unittest -v test_spark_matrix
